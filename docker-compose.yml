# Workshop-3 infrastructure: Kafka (single broker, KRaft, no ZooKeeper) + MySQL 8.
# Start:   docker compose up -d
# Kafka UI (optional): docker compose --profile tools up -d
#
# The topic `happiness-events` (3 partitions) is created programmatically by
# kafka/producer.py (Part B, task 6.2), not here.

services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: workshop3-kafka
    ports:
      - "9092:9092"
    environment:
      # Single-node KRaft broker (per apache/kafka official docs)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Host clients (producer/consumer) connect via PLAINTEXT://localhost:9092;
      # containers on the compose network (kafka-ui) connect via INTERNAL://kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      # Single broker: replication factor 1 everywhere
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mysql:
    image: mysql:8.0
    container_name: workshop3-mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-happiness_db}
      MYSQL_USER: ${MYSQL_USER:-happiness_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
    # UTF-8 full support (utf8mb4)
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # NOTE: ping -h localhost avoids the TCP-only check that fails while still initializing
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change_me_root}"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Optional dev tool. NOT started by default:
  #   docker compose --profile tools up -d
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: workshop3-kafka-ui
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  mysql_data:
